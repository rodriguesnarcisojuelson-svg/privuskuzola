<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pagamento confirmado — PRIA Guided | Privus Kuzola</title>
<link rel="stylesheet" href="/assets/css/fonts.css">
<style>
  :root{--navy:#0D1B2A;--gold:#C8A96E;--gold-l:#D9BE90;--cream:#F0EBE0;--white:#fff;--muted:#5A5346;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--navy);font-family:'Outfit',sans-serif;font-weight:300;}
  main{width:min(600px,100%);padding:34px 28px;background:var(--white);border:1px solid #E5DFD1;text-align:center;}
  .logo{display:block;width:min(310px,78vw);height:auto;margin:0 auto 26px;}
  .kicker{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  h1{margin:9px 0 12px;font:600 clamp(30px,7vw,43px)/1.05 'Cormorant Garamond',serif;}
  p{max-width:470px;margin:0 auto;color:var(--muted);font-size:13.5px;line-height:1.7;}
  .actions{display:grid;gap:11px;margin-top:28px;}
  .btn{display:block;padding:14px 18px;text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.3px;}
  .btn-primary{background:var(--gold);color:var(--navy);}
  .btn-secondary{background:var(--navy);color:var(--gold-l);}
  .support{margin-top:20px;font-size:11px;}
  .support a{color:var(--navy);}
</style>
</head>
<body>
<main>
  <a href="/"><img src="/logo-privus-horizontal.png" class="logo" alt="Privus — Consultoria Regulatória Digital" width="1200" height="360"></a>
  <div class="kicker">Pagamento confirmado</div>

  <p>O teu acesso foi validado. Podes iniciar o diagnóstico e marcar a sessão de 90 minutos com um consultor Privus.</p>
  <div class="actions">
    <a href="/pria-engine-prototype" class="btn btn-primary">Começar o PRIA</a>
    <a href="https://outlook.office.com/bookwithme/user/365cf441b11d439290dd29e1bc9b7536@Privuskuzola.pt/meetingtype/4Hi0Kun4L0KA-VZET9wv7g2?anonymous&ismsaljsauthenabled&ep=mLinkFromTile" class="btn btn-secondary" target="_blank" rel="noopener">Marcar sessão de 90 minutos</a>
  </div>
  <p class="support">Precisas de ajuda? <a href="mailto:contacto@privuskuzola.pt">contacto@privuskuzola.pt</a></p>

</body>
</html>
